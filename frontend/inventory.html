<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventário - tradexGG</title>
  <link rel="stylesheet" href="/css/style.css">
  <!-- loader.css removido: loader nao aparece nesta pagina -->
</head>
<body>
  <div class="container">
    <div class="inventory-header">
      <h1 class="page-title" style="margin:0">Meu Inventário</h1>
      <div class="inventory-summary" id="inventory-summary" style="display:none;">
        <span id="inv-total-items">— itens</span>
        <span class="inv-sep">·</span>
        <span id="inv-total-value" style="color:var(--brass)">R$ —</span>
        <button class="btn btn-ghost btn-sm" id="btn-sell-all" style="margin-left:0.5rem;">Vender Tudo</button>
      </div>
    </div>
    <div class="card-grid" id="inventory-grid">
      <div class="loading">Carregando inventário...</div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/inventory.js"></script>
</body>
</html>
