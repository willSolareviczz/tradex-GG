<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — tradexGG</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <a href="/" class="auth-logo">tradex<span>GG</span></a>
      <div class="auth-title">Entrar na conta</div>
      <div class="auth-sub">Saldo virtual · Skins CS2 · Provably Fair</div>

      <form id="auth-form" data-type="login" class="auth-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required placeholder="seu@email.com" class="form-input">
        </div>
        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" required placeholder="Sua senha" class="form-input">
        </div>
        <div class="form-error" id="form-error"></div>
        <div style="text-align: right; margin-bottom: 0.75rem;">
          <a href="/forgot-password.html" class="auth-small-link">Esqueceu a senha?</a>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Entrar</button>
      </form>

      <div class="auth-footer">
        Não tem conta? <a href="/register.html">Cadastre-se grátis</a>
      </div>
      <div class="auth-disclaimer">Ao entrar você confirma ter 18+ anos e aceita os <a href="/termos.html">Termos de Uso</a>.</div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
