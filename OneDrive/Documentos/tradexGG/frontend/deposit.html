<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Depositar - tradexGG</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <div class="form-container" style="max-width: 500px;">
      <div class="card">
        <h2>Depositar via PIX</h2>

        <!-- Step 1: Choose amount -->
        <div id="step-amount">
          <p style="color: var(--text-secondary); margin-bottom: 1rem; font-size: 0.9rem;">Escolha o valor do depósito:</p>
          <div class="deposit-amounts">
            <button class="deposit-amount-btn" data-amount="1000">R$10</button>
            <button class="deposit-amount-btn" data-amount="2500">R$25</button>
            <button class="deposit-amount-btn" data-amount="5000">R$50</button>
            <button class="deposit-amount-btn" data-amount="10000">R$100</button>
          </div>
          <div class="form-group">
            <label for="custom-amount">Ou digite um valor personalizado (mínimo R$5,00):</label>
            <input type="number" id="custom-amount" placeholder="0,00" min="5" step="0.01">
          </div>
          <button class="btn btn-primary" style="width: 100%;" id="btn-deposit">Gerar PIX</button>
        </div>

        <!-- Step 2: Show QR code -->
        <div id="step-qr" style="display: none;">
          <div class="qr-container">
            <img id="qr-image" src="" alt="QR Code PIX">
            <p style="color: var(--text-secondary); margin-bottom: 0.5rem; font-size: 0.85rem;">Ou copie o código PIX:</p>
            <div class="pix-copy" id="pix-copy" title="Clique para copiar"></div>
            <p id="pix-status" style="color: var(--accent); font-weight: 600; margin-top: 1rem;">Aguardando pagamento...</p>
          </div>
          <button class="btn btn-secondary" style="width: 100%;" onclick="window.location.reload()">Novo Depósito</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/deposit.js"></script>
</body>
</html>
