<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roleta - tradexGG</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/games.css">
</head>
<body>

  <div class="live-drops-bar" id="live-drops-bar">
    <span class="live-drops-label"><span class="live-dot"></span>DROPS AO VIVO</span>
    <div class="live-drops-track-wrap">
      <div class="live-drops-track" id="live-drops-track">
        <div class="live-drops-loading">Carregando drops...</div>
      </div>
    </div>
  </div>

  <div class="container">

    <div class="games-hero">
      <h1>Jogos ao Vivo</h1>
      <p>Aposte, ganhe e compita contra outros jogadores em tempo real</p>
    </div>
    <div class="game-tabs">
      <a href="/crash.html"        class="game-tab">Crash</a>
      <a href="/coinflip.html"     class="game-tab">Coinflip</a>
      <a href="/roulette-game.html" class="game-tab active">Roleta</a>
      <a href="/battle.html"       class="game-tab">Case Battle</a>
    </div>

    <!-- Roulette track -->
    <div class="roulette-track">
      <div class="roulette-fade-left"></div>
      <div class="roulette-fade-right"></div>
      <div class="roulette-needle"></div>
      <div class="roulette-cells" id="roulette-cells"></div>
    </div>

    <!-- Countdown + status -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
      <span class="status-badge betting" id="rl-status-badge">APOSTAS ABERTAS</span>
      <span id="rl-timer" style="font-size:0.9rem;font-weight:700;color:var(--text-secondary)">--s</span>
    </div>
    <div class="countdown-bar-wrap">
      <div class="countdown-bar" id="rl-countdown-bar" style="width:100%"></div>
    </div>

    <!-- History dots -->
    <div class="roulette-history" id="rl-history"></div>

    <div style="display:grid;grid-template-columns:1fr 300px;gap:24px;align-items:start">

      <!-- Left: bet controls -->
      <div class="game-panel">
        <div class="game-panel-title">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
          Fazer Aposta
        </div>

        <!-- Color buttons -->
        <div class="color-bets">
          <button class="color-bet-btn" data-color="red" onclick="selectColor('red')">
            VERMELHO
            <span class="mult-label">2x · 7 números</span>
          </button>
          <button class="color-bet-btn" data-color="black" onclick="selectColor('black')">
            PRETO
            <span class="mult-label">2x · 7 números</span>
          </button>
          <button class="color-bet-btn" data-color="green" onclick="selectColor('green')">
            VERDE
            <span class="mult-label">14x · 1 número</span>
          </button>
        </div>

        <!-- Amount input -->
        <div class="bet-row">
          <div class="bet-field">
            <label>Valor</label>
            <div class="bet-input-wrap">
              <span>R$</span>
              <input type="number" id="rl-amount" class="bet-input" placeholder="0,00" min="1" step="0.01">
            </div>
            <div class="quick-amounts">
              <button onclick="setRlAmount(100)">R$1</button>
              <button onclick="setRlAmount(500)">R$5</button>
              <button onclick="setRlAmount(1000)">R$10</button>
              <button onclick="setRlAmount(5000)">R$50</button>
              <button onclick="setRlAmount(10000)">R$100</button>
              <button onclick="doubleRlAmount()">2x</button>
              <button onclick="halfRlAmount()">½</button>
            </div>
          </div>
          <button class="btn btn-primary" id="rl-bet-btn" onclick="placeBet()" style="min-width:120px;padding:12px">
            APOSTAR
          </button>
        </div>
        <p id="rl-bet-msg" style="font-size:0.82rem;color:var(--text-secondary);margin-top:8px"></p>
      </div>

      <!-- Right: bets breakdown -->
      <div class="game-panel">
        <div class="game-panel-title">Apostas do Round</div>
        <div style="display:flex;gap:8px;margin-bottom:16px">
          <div style="flex:1;text-align:center;padding:10px;background:rgba(192,57,43,0.1);border-radius:10px">
            <div style="font-size:0.75rem;color:#e74c3c;font-weight:700;margin-bottom:2px">VERMELHO</div>
            <div id="rl-total-red" style="font-size:1rem;font-weight:800;color:var(--accent)">R$0,00</div>
          </div>
          <div style="flex:1;text-align:center;padding:10px;background:rgba(50,50,50,0.3);border-radius:10px">
            <div style="font-size:0.75rem;color:#aaa;font-weight:700;margin-bottom:2px">PRETO</div>
            <div id="rl-total-black" style="font-size:1rem;font-weight:800;color:var(--accent)">R$0,00</div>
          </div>
          <div style="flex:1;text-align:center;padding:10px;background:rgba(39,174,96,0.1);border-radius:10px">
            <div style="font-size:0.75rem;color:#2ecc71;font-weight:700;margin-bottom:2px">VERDE</div>
            <div id="rl-total-green" style="font-size:1rem;font-weight:800;color:var(--accent)">R$0,00</div>
          </div>
        </div>
        <div class="bets-list" id="rl-bets-list">
          <div style="color:var(--text-secondary);font-size:0.85rem;text-align:center;padding:16px">Nenhuma aposta ainda</div>
        </div>
      </div>
    </div>

  </div>

  <script src="/js/api.js"></script>
  <script src="/js/roulette-game.js"></script>
</body>
</html>
