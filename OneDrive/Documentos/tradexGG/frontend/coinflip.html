<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coinflip - tradexGG</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/games.css">
</head>
<body>

  <div class="live-drops-bar" id="live-drops-bar">
    <span class="live-drops-label"><span class="live-dot"></span>DROPS AO VIVO</span>
    <div class="live-drops-track-wrap">
      <div class="live-drops-track" id="live-drops-track">
        <div class="live-drops-loading">Carregando drops...</div>
      </div>
    </div>
  </div>

  <div class="container">

    <div class="games-hero">
      <h1>Jogos ao Vivo</h1>
      <p>Aposte, ganhe e compita contra outros jogadores em tempo real</p>
    </div>
    <div class="game-tabs">
      <a href="/crash.html"        class="game-tab">Crash</a>
      <a href="/coinflip.html"     class="game-tab active">Coinflip</a>
      <a href="/roulette-game.html" class="game-tab">Roleta</a>
      <a href="/battle.html"       class="game-tab">Case Battle</a>
    </div>

    <div style="display:grid;grid-template-columns:300px 1fr;gap:24px;align-items:start">

      <!-- Create coinflip panel -->
      <div class="game-panel" style="position:sticky;top:80px">
        <div class="game-panel-title">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
          Criar Coinflip
        </div>

        <!-- Coin display -->
        <div style="text-align:center;margin-bottom:20px">
          <span class="coin-anim" id="coin-display" style="animation:none">🪙</span>
        </div>

        <!-- Side selector -->
        <div class="side-selector">
          <button class="side-btn active" data-side="T" onclick="selectSide('T')">🔶 T</button>
          <button class="side-btn" data-side="CT" onclick="selectSide('CT')">🔷 CT</button>
        </div>

        <div class="bet-row" style="flex-direction:column;gap:12px">
          <div class="bet-field" style="width:100%">
            <label>Valor</label>
            <div class="bet-input-wrap">
              <span>R$</span>
              <input type="number" id="flip-amount" class="bet-input" placeholder="0,00" min="1" step="0.01">
            </div>
            <div class="quick-amounts">
              <button onclick="setFlipAmount(100)">R$1</button>
              <button onclick="setFlipAmount(500)">R$5</button>
              <button onclick="setFlipAmount(1000)">R$10</button>
              <button onclick="setFlipAmount(5000)">R$50</button>
            </div>
          </div>
          <button class="btn btn-primary" onclick="createFlip()" style="width:100%;padding:13px">
            CRIAR COINFLIP
          </button>
        </div>

        <!-- Result banner -->
        <div class="flip-result-banner" id="flip-result-banner"></div>
      </div>

      <!-- Active coinflips list -->
      <div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
          <h2 style="font-size:1.1rem;font-weight:700;margin:0">Coinflips Abertos</h2>
          <span id="flips-count" style="color:var(--text-secondary);font-size:0.85rem">0 ativos</span>
        </div>
        <div class="coinflip-grid" id="coinflips-grid">
          <div style="color:var(--text-secondary);font-size:0.9rem;padding:24px;text-align:center;grid-column:1/-1">
            Nenhum coinflip aberto. Seja o primeiro!
          </div>
        </div>

        <!-- History -->
        <div style="margin-top:32px">
          <h2 style="font-size:1rem;font-weight:700;margin-bottom:16px;color:var(--text-secondary)">Histórico Recente</h2>
          <div id="coinflip-history" style="display:flex;flex-direction:column;gap:8px"></div>
        </div>
      </div>
    </div>

  </div>

  <script src="/js/api.js"></script>
  <script src="/js/coinflip.js"></script>
</body>
</html>
