<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Case Battle - tradexGG</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/games.css">
</head>
<body>

  <div class="live-drops-bar" id="live-drops-bar">
    <span class="live-drops-label"><span class="live-dot"></span>DROPS AO VIVO</span>
    <div class="live-drops-track-wrap">
      <div class="live-drops-track" id="live-drops-track">
        <div class="live-drops-loading">Carregando drops...</div>
      </div>
    </div>
  </div>

  <div class="container">

    <div class="games-hero">
      <h1>Jogos ao Vivo</h1>
      <p>Aposte, ganhe e compita contra outros jogadores em tempo real</p>
    </div>
    <div class="game-tabs">
      <a href="/crash.html"        class="game-tab">Crash</a>
      <a href="/coinflip.html"     class="game-tab">Coinflip</a>
      <a href="/roulette-game.html" class="game-tab">Roleta</a>
      <a href="/battle.html"       class="game-tab active">Case Battle</a>
    </div>

    <div class="battle-layout">

      <!-- Left: Create battle -->
      <div class="game-panel" style="position:sticky;top:80px">
        <div class="game-panel-title">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 10c-.83 0-1.5-.67-1.5-1.5v-5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5v5c0 .83-.67 1.5-1.5 1.5z"/><path d="M20.5 10H19V8.5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/><path d="M9.5 14c.83 0 1.5.67 1.5 1.5v5c0 .83-.67 1.5-1.5 1.5S8 21.33 8 20.5v-5c0-.83.67-1.5 1.5-1.5z"/><path d="M3.5 14H5v1.5c0 .83-.67 1.5-1.5 1.5S2 16.33 2 15.5 2.67 14 3.5 14z"/><path d="M14 14.5c0-.83.67-1.5 1.5-1.5h5c.83 0 1.5.67 1.5 1.5s-.67 1.5-1.5 1.5h-5c-.83 0-1.5-.67-1.5-1.5z"/><path d="M15.5 19H14v1.5c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5-.67-1.5-1.5-1.5z"/><path d="M10 9.5C10 8.67 9.33 8 8.5 8h-5C2.67 8 2 8.67 2 9.5S2.67 11 3.5 11h5c.83 0 1.5-.67 1.5-1.5z"/><path d="M8.5 5H10V3.5C10 2.67 9.33 2 8.5 2S7 2.67 7 3.5 7.67 5 8.5 5z"/></svg>
          Criar Battle
        </div>

        <div style="margin-bottom:14px">
          <label style="display:block;font-size:0.78rem;font-weight:600;color:var(--text-secondary);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.05em">Escolher Caixa</label>
          <select id="battle-case-select" class="bet-input" style="padding-left:12px">
            <option value="">Carregando caixas...</option>
          </select>
        </div>

        <div style="margin-bottom:14px">
          <label style="display:block;font-size:0.78rem;font-weight:600;color:var(--text-secondary);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.05em">Nº de Jogadores</label>
          <div style="display:flex;gap:8px">
            <button class="side-btn active" id="slots-2" onclick="selectSlots(2)">2 Players</button>
            <button class="side-btn" id="slots-3" onclick="selectSlots(3)">3 Players</button>
            <button class="side-btn" id="slots-4" onclick="selectSlots(4)">4 Players</button>
          </div>
        </div>

        <div id="battle-preview" style="text-align:center;padding:16px;background:rgba(255,255,255,0.03);border-radius:10px;margin-bottom:16px;display:none">
          <div style="font-size:0.82rem;color:var(--text-secondary)">Entry fee</div>
          <div id="battle-entry-fee" style="font-size:1.8rem;font-weight:900;color:var(--accent)">R$0,00</div>
          <div style="font-size:0.78rem;color:var(--text-secondary);margin-top:4px">Prize pool (95%): <strong id="battle-prize-preview" style="color:#4caf50">R$0,00</strong></div>
        </div>

        <button class="btn btn-primary" onclick="createBattle()" style="width:100%;padding:13px">
          CRIAR BATTLE
        </button>
      </div>

      <!-- Right: Active battles -->
      <div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
          <h2 style="font-size:1.1rem;font-weight:700;margin:0">Battles Abertas</h2>
          <button class="btn btn-secondary" onclick="loadBattles()" style="padding:6px 14px;font-size:0.82rem">Atualizar</button>
        </div>
        <div class="battle-grid" id="battles-grid">
          <div style="color:var(--text-secondary);font-size:0.9rem;padding:24px;text-align:center;grid-column:1/-1">
            Nenhuma battle aberta. Crie uma!
          </div>
        </div>

        <div style="margin-top:32px">
          <h2 style="font-size:1rem;font-weight:700;margin-bottom:16px;color:var(--text-secondary)">Últimas Battles</h2>
          <div id="battles-history" style="display:flex;flex-direction:column;gap:8px"></div>
        </div>
      </div>
    </div>

  </div>

  <script src="/js/api.js"></script>
  <script src="/js/battle.js"></script>
</body>
</html>
