<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="box" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eb4b4b"/>
      <stop offset="100%" style="stop-color:#aa2222"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" fill="url(#bg)" rx="16"/>
  <!-- Case box shape -->
  <rect x="48" y="60" width="160" height="120" rx="8" fill="url(#box)" opacity="0.15"/>
  <rect x="48" y="60" width="160" height="120" rx="8" fill="none" stroke="url(#box)" stroke-width="2.5" filter="url(#glow)"/>
  <!-- Lock/latch -->
  <rect x="118" y="52" width="20" height="16" rx="4" fill="#eb4b4b" opacity="0.8"/>
  <!-- Inner shine -->
  <line x1="68" y1="120" x2="188" y2="120" stroke="#eb4b4b" stroke-width="1" opacity="0.3"/>
  <!-- Icon -->
  <text x="128" y="128" text-anchor="middle" font-size="40" fill="#eb4b4b" opacity="0.6">🎯</text>
  <!-- Name -->
  <text x="128" y="215" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="18" fill="#eb4b4b" letter-spacing="2">CLUTCH</text>
  <text x="128" y="235" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#8b949e">CASE</text>
</svg>